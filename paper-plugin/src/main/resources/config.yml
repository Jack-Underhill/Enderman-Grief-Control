# EndermanGriefControl configuration

# If a world is not listed under "worlds", this value decides
# whether the plugin is enabled there by default.
default-enabled: true

# Per-world overrides.
# Add world names and set them to true/false as needed.
# Example:
# worlds:
#   world: true
#   world_nether: false
#   world_the_end: true
worlds: {}

# Handling for endermen already stuck holding a block placement can no longer clear (e.g. picked
# up before the plugin was enabled, or during a window where it was toggled off). Checked every
# ~2 minutes. One of:
#   auto-clear - remove the carried block outright, nothing dropped (endermen only ever carry
#                common terrain blocks). The default - this is resolved automatically, no
#                configuration needed. Every clear is always logged regardless of "logging" below,
#                since it's a one-time resolution confirming an actual problem just got fixed, not
#                a routine prevented-attempt notice.
#   alert      - instead of clearing, periodically re-log its location (see "logging" below for
#                the message) so you can hunt it down and kill it yourself. For players who'd
#                rather nothing be resolved on their behalf automatically.
#   off        - leave it alone entirely.
#
# If a world is not listed under "held-block-worlds", this value decides its handling by default.
default-held-block-handling: auto-clear

# Per-world overrides, same shape as "worlds" above.
# Example:
# held-block-worlds:
#   world_nether: alert
#   world_the_end: off
held-block-worlds: {}

logging:
  # If true, log whenever the plugin denies an enderman block pickup/placement.
  enabled: false
